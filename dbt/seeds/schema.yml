version: 2
seeds:
  - name: scoring_stat_map
    description: >
      Sleeper scoring key -> nflverse stat expression. GENERATED from src/league_lab/scoring.py
      (tests/test_scoring.py fails if they diverge). Do not edit by hand.
    columns:
      - name: sleeper_key
        tests: [unique, not_null]
      - name: kind
        description: "stat = a weekly-stats column list; bonus = long-TD count from play-by-play or a per-game yardage threshold (column:low:high)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [stat, bonus]
      - name: stat_expression
        tests: [not_null]
  - name: reference_scorings
    description: >
      Plan F1 (Wave F): the scorings `league-lab project` fits the residual ranges in and writes NFL-wide
      (`ops.projection_ranges`, `ops.kd_ranges`; read by `projections.reference_scorings`). `scrubs` and `dynasty`
      are League of Scrubs' and Forever Unclean Dynasty's `scoring_settings` copied from `dim_league_season` on
      2026-10-02 (the house leagues' `ops.projections` take their ranges from the reference whose priced keys
      equal theirs; a house league that no longer equals one is fitted on its own, as before); `ppr`, `standard`
      and `te_premium` are Sleeper's defaults with 1 / 0 / 1 point per catch (+0.5 per TE catch, `bonus_rec_te`)
      and a 4-pt pass TD. Adding a row adds a fitted scoring (about 1 minute of `project` per row). A row's
      settings are never edited once published (frozen weeks were priced in them): add a new name instead. Hand-written,
      not generated; `scoring_settings` is the JSON of a Sleeper `scoring_settings` dict.
    columns:
      - name: name
        tests: [unique, not_null]
      - name: label
        tests: [not_null]
      - name: scoring_settings
        tests: [not_null]
  - name: feature_experiments
    description: >
      The published record of the feature experiments (Wave D, `league-lab experiment <group>`): the same
      columns as ops.feature_experiments, exported from the PO's database (`\copy (select * from
      ops.feature_experiments order by run_at, feature_group, position, league_id, test_season) to
      'dbt/seeds/feature_experiments.csv' csv header`). mart_feature_experiments unions it with the live
      table so "What we tried" fills on a fresh build. Re-export after a harness run worth keeping.
    columns:
      - name: run_id
        tests: [not_null]
      - name: feature_group
        tests: [not_null]
  - name: metric_registry
    description: Metric definitions, versions and availability (plan §6). Surfaced in the explorer.
    columns:
      - name: metric
        tests: [unique, not_null]
  - name: trend_metrics
    description: >
      The metrics the trend model tracks: label, the practical minimum change worth calling a
      trend, whether the metric is *opportunity* (feeds the momentum score) and which positions
      it applies to. Edit here to add or retune a metric.
    columns:
      - name: metric
        tests: [unique, not_null]

  - name: ranking_weights
    description: "Transparent baseline projection weights per position (OLS fit by `league-lab fit-rankings`; formula applied in mart_player_week_rankings)."
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [position, feature]
    columns:
      - name: weight
        tests: [not_null]
