version: 2

sources:
  - name: raw
    description: >
      Source tables loaded by `league-lab ingest`. Each table is replaced one partition at a
      time inside a transaction; provenance is in ops.load_manifest. Never modelled directly by
      the explorer.
    schema: raw
    loader: league_lab.ingest
    tables:
      - name: sleeper_league
        description: One row per league-season in the previous_league_id chain (full payload in `payload`).
        columns:
          - name: league_id
            tests: [unique, not_null]
      - name: sleeper_league_user
      - name: sleeper_roster
      - name: sleeper_matchup
        description: One row per league-week-roster; players_points is the per-player observed points map.
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [league_id, week, roster_id]
      - name: sleeper_transaction
      - name: sleeper_draft
      - name: sleeper_draft_pick
      - name: sleeper_traded_pick
      - name: sleeper_bracket
      - name: sleeper_player
        description: Sleeper's NFL player directory (cached at most daily).
      - name: sleeper_state
      - name: nfl_player_stats_week
        description: "nflverse stats_player_week_<season>.parquet, all columns. Attribution: nflverse."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [player_id, season, week]
      - name: nfl_team_stats_week
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [team, season, week]
      - name: nfl_schedules
        columns:
          - name: game_id
            tests: [unique, not_null]
      - name: nfl_rosters_weekly
      - name: nfl_snap_counts
      - name: nfl_players
        columns:
          - name: gsis_id
            tests: [unique, not_null]
      - name: nfl_teams
      - name: nfl_ff_playerids
        description: "dynastyprocess db_playerids.csv, cross-provider ID crosswalk (sleeper_id <-> gsis_id)."
      - name: nfl_ff_opportunity
        description: "ffverse/ffopportunity expected points model output per player-week (ep_weekly_<season>.parquet)."
      - name: nfl_pbp
        description: "nflfastR play_by_play_<season>.parquet, core column subset (LEAGUE_LAB_PBP_COLUMNS=all for every column). Attribution: nflverse."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [game_id, play_id]
      - name: nfl_pbp_participation
        description: "nflverse pbp_participation_<season>.parquet: players on the field per play (2016 to the last completed season)."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [nflverse_game_id, play_id]
      - name: nfl_ftn_charting
        description: "FTN Data charting via nflverse (ftn_charting_<season>.parquet, 2022+). License CC-BY-SA 4.0 - attribute FTN Data."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [nflverse_game_id, nflverse_play_id]
      - name: routes_feed
        description: "Licensed routes-run import contract (league-lab import-routes). Empty until a provider export is imported."
      - name: nfl_injuries
        description: Weekly NFL injury reports (report status + practice status) per player.
      - name: nfl_depth_charts
        description: Depth chart snapshots (many per season, `dt` timestamp); recent seasons only.
      - name: nfl_ngs_receiving
      - name: nfl_ngs_rushing
      - name: nfl_ngs_passing
      - name: nfl_pfr_advstats_def
        description: Pro-Football-Reference advanced defensive stats per player-game (coverage targets/yards allowed), 2018+.
      - name: nfl_pfr_advstats_rec
      - name: nfl_pfr_advstats_pass
      - name: nfl_pfr_advstats_rush
      - name: nfl_weather
        description: "Plan D3, `league-lab ingest weather` (league_lab.ingest.weather): Open-Meteo hourly weather at the stadium for the kickoff hour and the two after, per game. source = 'archive' (ERA5 reanalysis, one row per game, replaced when the stadium-season is re-fetched) or 'forecast' (one row per game per fetch, kept forever: forecast_hours_ahead = kickoff - fetched_at). Partition = (source, season, stadium_id). Empty until the first run from a machine that reaches open-meteo.com. Attribution: Open-Meteo.com (CC BY 4.0), ERA5 (Copernicus C3S)."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [game_id, source, fetched_at]
        columns:
          - name: source
            tests:
              - accepted_values:
                  arguments:
                    values: [archive, forecast]
          - name: forecast_hours_ahead
            description: "Forecast rows only, always > 0 (a forecast is fetched before kickoff)."
      - name: nfl_stadiums
        description: "Plan D3: the stadium reference shipped with the code (src/league_lab/ingest/reference/stadiums.csv), reloaded by `db migrate` when the CSV changes: every venue of an NFL game 2016-2026 with latitude / longitude, time zone, roof type and tenants (team + seasons). Coordinates: each stadium's Wikipedia / GeoHack infobox, 4 decimals."
        columns:
          - name: stadium_id
            tests: [unique, not_null]
          - name: roof_type
            tests:
              - accepted_values:
                  arguments:
                    values: [outdoors, dome, retractable]
      - name: nfl_stadium_game_venues
        description: "Plan D3: per-game venue corrections (src/league_lab/ingest/reference/stadium_game_venues.csv): international games nflverse records at the home team's stadium."
        columns:
          - name: game_id
            tests: [unique, not_null]
          - name: stadium_id
            tests:
              - relationships:
                  arguments:
                    to: source('raw', 'nfl_stadiums')
                    field: stadium_id

  - name: ops
    schema: ops
    tables:
      - name: load_manifest
      - name: source_partition
      - name: backtest_results
        description: "Written by `league-lab backtest`: per season-week-position-scorer Spearman, top-N hit rate, MAE."
      - name: projections
        description: "Written by `league-lab project` (projection v2): per league x season x week x player, the projected stat line, its priced points and P10/P50/P90. Plan B5: a league-week is rewritten by every refit until its first kickoff and never after; frozen_source / frozen_at label the kept rows (assert_frozen_projections_precede_kickoff)."
      - name: projection_backtest
        description: "Written by `league-lab backtest-v2`: walk-forward scores per league-season-week-position-scorer, with interval coverage."
      - name: projection_importance
        description: "Plan U-15. model = 'component' (written by `league-lab project`, once per model version x training window): permutation importance of the component models on the newest training season, measured with a twin fitted without that season (fit_seasons), per position and input, in points of error of the priced line (component = 'total', reference scoring) and per stat in its own unit. model = 'quantile_p50' (written by `league-lab backtest-v2`; every row from before U-15): the P50 interval model on the newest test season."
      - name: projection_drift
        description: "Written by `league-lab drift` (and at the end of `league-lab project`), plan M-06: the live board's played weeks scored like the backtest, per league-season-week-position, with the week's games played / scheduled and (B5) frozen_share, the share of scored rows that are the board as published before kickoff."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [league_id, season, week, position]
      - name: lineups
        description: "Written by `league-lab lineups` (and at the end of `league-lab project`), plan B1: per league x season x week x roster x proposed/realised (`is_realised`), one row per starting slot (role starter | empty), bench player (role bench, `bench_rank`) and player who cannot play (role unplayable, `reason`), with `value`, `value_source` (`unvalued` = no value yet, counted 0, seated only where nobody valued can play), re-solved `margin` and `is_locked`."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [league_id, season, week, roster_id, is_realised, slot]
              config: {where: "slot is not null"}
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [league_id, season, week, roster_id, is_realised, sleeper_player_id]
              config: {where: "sleeper_player_id is not null"}
      - name: lineup_totals
        description: "Written with ops.lineups (plan B1): one row per lineup (league x season x week x roster x is_realised): lineup_value, bench_value (the best lineup the bench alone would field), filled / empty slots, weakest slot and margin, counts (`n_unvalued` = starters seated with no value yet); `inputs_fingerprint` = md5 of the Sleeper points a realised lineup was solved on."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [league_id, season, week, roster_id, is_realised]
      - name: waiver_moves
        description: "Written by `league-lab waivers` (and at the end of `league-lab project`, after the lineups), plan B3: per league x season x decision week x roster, every legal add/drop pair that raises the B1 lineup this week or over the 4-week horizon (weekly / horizon gain, the slot the add takes, the starter he displaces, the drop's cost), or one `nothing` row per roster; `inputs_fingerprint` = the league's rosters and free-agent statuses the moves were computed on."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [league_id, season, week, roster_id, add_sleeper_id, drop_sleeper_id]
      - name: player_role_alerts
        description: "Written by `league-lab project` / `league-lab signals` (plan R-10, src/league_lab/signals.py, rule ra1.1): every role alert of every season — a step change in a QB/RB/WR/TE's snap / route / target / carry share over his last one to three games with its kind, cause, evidence and expiry; the projected season is rewritten each run, any other season when the table lacks it under the current signals_version."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, gsis_id, week]
      - name: player_scenarios
        description: "Written by `league-lab project` / `league-lab signals` (plan R-12): per league x season x week x QB/RB/WR/TE with a live bigger-role alert, the base projection, the larger-role scenario and the 'with the alert' line with its stat lines, the calibration shown instead of a probability, the inputs set and the expiry; the projected season's rows are replaced each run."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [league_id, season, week, gsis_id]
      - name: waiver_upside
        description: "Written by the waiver engine right after ops.waiver_moves (plan R-12, list_kind = 'upside'): per league x season x decision week x roster, free agents with a live bigger-role scenario who do not help at their projection today, valued as a claim at their projection and if the role holds, with the cheapest drop."
        tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [league_id, season, week, roster_id, add_sleeper_id]

