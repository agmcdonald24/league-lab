version: 2

models:
  - name: int_player_id_map
    columns:
      - name: gsis_id
        tests: [not_null]
      - name: sleeper_id
        tests: [not_null]
  - name: int_player_game_snaps
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gsis_id, game_id]
  - name: int_player_week_team
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gsis_id, season, week]
  - name: int_current_league
    columns:
      - name: league_id
        tests: [unique, not_null]
  - name: int_nfl_calendar
    columns:
      - name: season
        tests: [unique, not_null]
  - name: int_expected_points_week
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gsis_id, game_id]
  - name: int_defender_game_coverage
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gsis_id, game_id]
  - name: int_pfr_gsis_map
    columns:
      - name: pfr_id
        tests: [unique, not_null]
  - name: int_player_game_metric_long
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gsis_id, game_id, metric]
  # plan R-10 (C6): role inputs per player x team-game, missed games included (src/league_lab/signals.py)
  - name: int_player_game_role
    description: "Every QB / RB / WR / TE on a team's weekly roster (or who played for it) for every played regular-season game: status (played / out_injured / inactive), snap share (0 when he missed a game that has snap counts; NULL when the game has none), route share (the routes proxy; NULL without participation), target / carry share, the stat line and expected points. Read by the role-alert rule."
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [gsis_id, game_id]
      - expression_is_true:
          name: role_shares_are_shares
          arguments:
            expression: "coalesce(snap_share, 0) between 0 and 1 and coalesce(route_share, 0) between 0 and 1 and coalesce(target_share, 0) between 0 and 1 and coalesce(carry_share, 0) between 0 and 1"
      - expression_is_true:
          name: role_missed_game_has_no_usage
          arguments:
            expression: "targets = 0 and carries = 0 and coalesce(snap_share, 0) = 0"
            condition: "status <> 'played'"
    columns:
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["played", "out_injured", "inactive"]
      - name: position
        tests:
          - accepted_values:
              arguments:
                values: ["QB", "RB", "WR", "TE"]
