name: league_lab
version: "0.1.0"
config-version: 2
profile: league_lab
require-dbt-version: [">=1.9.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # NFL season year of the first history partition (matches LEAGUE_LAB_SEASONS_START)
  seasons_start: "{{ env_var('LEAGUE_LAB_SEASONS_START', '2016') | int }}"
  # league whose scoring prices NFL-wide points (first id in LEAGUE_LAB_SLEEPER_LEAGUE_ID; set by the CLI)
  reference_league_id: "{{ env_var('LEAGUE_LAB_REFERENCE_LEAGUE_ID', '') }}"
  # tolerance (fantasy points) when reconciling recomputed vs Sleeper-observed points
  points_tolerance: 0.5

models:
  league_lab:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: analytics
      +materialized: table

seeds:
  league_lab:
    +schema: analytics_seeds
    # seeds are small and their columns change with the code: always recreate them so a new
    # column (scoring_stat_map.kind) never needs a manual --full-refresh
    +full_refresh: true
    scoring_stat_map:
      +column_types:
        sleeper_key: text
        kind: text
        stat_expression: text
        description: text
    trend_metrics:
      +column_types:
        metric: text
        label: text
        arrow_label: text
        min_change: numeric
        is_opportunity: boolean
        positions: text
        higher_is_better: boolean
        display_kind: text
    ranking_weights:
      +column_types:
        position: text
        feature: text
        weight: numeric
        train_seasons: text
        n_rows: integer
        r2_train: numeric
        fitted_at: text
    metric_registry:
      +column_types:
        metric: text
        version: text
        numerator: text
        denominator: text
        grain: text
        status: text
        notes: text
    # the published record of the feature experiments (Wave D): the same columns as ops.feature_experiments,
    # so a fresh database shows "What we tried" without re-running 10 CPU-minutes per group
    feature_experiments:
      +column_types:
        run_id: text
        run_at: timestamptz
        model_version: text
        harness_version: text
        feature_group: text
        group_table: text
        group_columns: text
        test_seasons: text
        train_seasons: text
        data_key: text
        position: text
        league_id: text
        test_season: integer
        n_weeks: integer
        n_player_weeks: integer
        spearman: double precision
        hit_rate: double precision
        mae: double precision
        coverage_80: double precision
        interval_width: double precision
        interval_score: double precision
        baseline_spearman: double precision
        baseline_hit_rate: double precision
        baseline_mae: double precision
        baseline_coverage_80: double precision
        baseline_interval_width: double precision
        baseline_interval_score: double precision
        delta_spearman: double precision
        delta_hit_rate: double precision
        delta_mae: double precision
        delta_coverage_80: double precision
        delta_interval_width: double precision
        delta_interval_score: double precision
        decision: text
        group_verdict: text
        runtime_s: double precision
        no_peek_warnings: text
        label: text
        note: text

tests:
  league_lab:
    +store_failures: true
    +schema: analytics_test_failures
