[project]
name = "league-lab"
version = "0.1.0"
description = "League Lab — local analytics platform for a Sleeper league and NFL skill-position research"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.30",
    "pyarrow>=18",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "typer>=0.15",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "dbt-core>=1.9,<1.12",
    "dbt-postgres>=1.9,<2",
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
    "rich>=13",
    "numpy>=2",
    "scikit-learn>=1.5",
    "scipy>=1.18.1",
]

[project.scripts]
league-lab = "league_lab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/league_lab"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008"]  # B008: typer.Option defaults are the CLI idiom

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/make_sleeper_fixture.py" = ["E701", "E702", "B905", "B023"]
"app/lib/db.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
