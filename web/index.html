<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- ---- IM-3 (Wave I-M): found by search engines, honestly — the words are brand.ts's name and the setup screen's line.
         ---- IN-1 (Wave I-N): the block between the ll:seo markers is the DEFAULT link preview; the server puts each
         public path's own in its place (api/league_lab_api/blog.py `shell`: /, /home, /blog, a post, the tools). Keep the
         markers and the plain title (the image workflow greps it); the inline script below is not part of it (its hash is the CSP's). -->
    <!-- ll:seo -->
    <title>isuckatfantasy</title>
    <meta name="description" content="Who to start this week and what each player is worth, in your league's own scoring — on Sleeper, MyFantasyLeague, ESPN or Yahoo. Browse every player's numbers without a league." />
    <link rel="canonical" href="https://isuckatfantasy.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="isuckatfantasy" />
    <meta property="og:title" content="isuckatfantasy" />
    <meta property="og:description" content="Who to start this week and what each player is worth, in your league's own scoring — on Sleeper, MyFantasyLeague, ESPN or Yahoo. Browse every player's numbers without a league." />
    <meta property="og:url" content="https://isuckatfantasy.io/" />
    <meta property="og:image" content="https://isuckatfantasy.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /ll:seo -->
    <link rel="alternate" type="application/rss+xml" title="isuckatfantasy · Blog" href="/blog/rss.xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121721" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="isuckatfantasy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Start the first screen's API call now, in parallel with the app's own download (src/lib/api.ts picks it up).
      // Same rule as the app: the URL's league / team, else the ones remembered on this phone. With no league yet
      // (the sign-in screen) and a Sleeper username remembered, the user's league list. The URLs must match
      // src/lib/api.ts `paths` exactly.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var ls = window.localStorage;
          var enc = encodeURIComponent;
          var path = location.pathname.replace(/\/+$/, "") || "/";
          var league = q.get("league") || ls.getItem("ll.league");
          var url = null;
          if (!league) {
            var user = ls.getItem("ll.user");
            if (user && (path === "/" || path === "/leagues")) url = "/api/leagues?username=" + enc(user);
          } else {
            var team = q.get("team") || ls.getItem("ll.team." + league);
            if (team && !/^\d+$/.test(team)) team = null;
            var m = path.match(/^\/player\/([^/]+)$/);
            if (m) url = "/api/player/" + m[1] + "?league=" + enc(league) + (team ? "&team=" + team : "");
            else if (path === "/" && team) url = "/api/my-week?league=" + enc(league) + "&team=" + team;
            else if (path === "/ros") {
              var pos = (q.get("position") || "ALL").toUpperCase();
              if (["QB", "RB", "WR", "TE", "K", "DEF", "ALL"].indexOf(pos) < 0) pos = "ALL";
              url = "/api/ros?league=" + enc(league) + "&position=" + pos + "&limit=50";
            } else if (path === "/record" || path === "/about") url = "/api/record?league=" + enc(league);
            // Wave G research screens (src/lib/api.ts researchPaths)
            else if (path === "/trends") url = "/api/trends?league=" + enc(league) + "&view=all&limit=200&metrics=none&min_games=2";
            else if (path === "/matchups") url = "/api/matchups/defense?league=" + enc(league) + (team ? "&team=" + team : "");
            else if (path === "/players" || path === "/compare" && !(q.get("a") && q.get("b"))) url = "/api/players?league=" + enc(league) + "&sort=points&dir=desc&limit=500";
            else if (path === "/receivers") url = "/api/receivers?league=" + enc(league) + "&limit=150";
            else if (path === "/compare") url = "/api/compare?league=" + enc(league) + "&a=" + enc(q.get("a")) + "&b=" + enc(q.get("b"));
          }
          if (url) window.__llPrefetch = { url: url, res: fetch(url, { credentials: "same-origin", headers: { Accept: "application/json" } }) };
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
