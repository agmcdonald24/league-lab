<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>League Lab</title>
    <meta name="description" content="Who to start this week and what each player is worth, in your Sleeper league's scoring." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f0d" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="League Lab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Start the first screen's API call now, in parallel with the app's own download (src/lib/api.ts picks it up).
      // Same rule as the app: the URL's league / team, else the ones remembered on this phone.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var ls = window.localStorage;
          var league = q.get("league") || ls.getItem("ll.league");
          if (!league) return;
          var team = q.get("team") || ls.getItem("ll.team." + league);
          if (team && !/^\d+$/.test(team)) team = null;
          var m = location.pathname.match(/^\/player\/([^/]+)\/?$/);
          var url = null;
          if (m) url = "/api/player/" + m[1] + "?league=" + encodeURIComponent(league) + (team ? "&team=" + team : "");
          else if (location.pathname === "/" && team) url = "/api/my-week?league=" + encodeURIComponent(league) + "&team=" + team;
          if (url) window.__llPrefetch = { url: url, res: fetch(url, { credentials: "same-origin", headers: { Accept: "application/json" } }) };
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
