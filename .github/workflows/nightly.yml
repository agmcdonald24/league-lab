# The nightly pipeline on a GitHub-hosted runner (plan B6 / I-01): a throwaway Postgres 18, the raw
# archive from the Actions cache, live Sleeper + nflverse for the current season, dbt build,
# projection v2, Sleeper's own projections (fetch-projections, plan E1) and the hosted sync to Neon.
# Every step lives in scripts/nightly.sh, the same script the Mac runs, so a failure here reproduces locally.
# Wave H: this workflow is the ONE writer of the hosted copy the beta reads (the API on the server and the
# Streamlit console); the Mac's launchd refresh builds only its own database (scripts/refresh.sh).
# Secrets (names): LEAGUE_LAB_SLEEPER_LEAGUE_ID, LEAGUE_LAB_HOSTED_ADMIN_URL, LEAGUE_LAB_HOSTED_APP_PASSWORD.
# Setup, secrets, cost and how to read a failed run: docs/HOSTING.md § "Nightly on GitHub Actions".
name: nightly

on:
  schedule:
    # GitHub cron is UTC. 11:37 UTC = 07:37 in New York on daylight time (EDT, mid-March to early
    # November) and 06:37 on standard time (EST). A run takes ~15 min (HOSTING.md § Cost), so the
    # hosted copy is fresh by about 08:00 EDT. Off the hour on purpose: GitHub delays, and under
    # load drops, scheduled runs queued at :00.
    # The freeze: a week's board and Sleeper's snapshot freeze at its first kickoff — Thursday 8:15-8:30 PM ET in 161 of
    # the 190 regular-season weeks 2016-2026 (analytics.dim_game), never earlier than 12:30 PM ET (Thanksgiving). The
    # run on that morning is the last before it, 5+ hours early even if GitHub starts it late; a dropped run leaves
    # the previous night's board and snapshot as the frozen ones.
    - cron: "37 11 * * *"
    # The backup (2026-10-03: GitHub dropped the 11:37 run outright - no run, no log - and Neon stayed a day old).
    # 13:07 UTC = 09:07 EDT. The `gate` job below lets it through only when no nightly has succeeded today (UTC), so
    # a normal morning costs it ten seconds; `concurrency: nightly` makes it wait if the 11:37 run is still going.
    - cron: "7 13 * * *"
  # 2026-10-04: neither cron is a clock (every scheduled run 2026-09-30..10-03 started 3.5-6 h late; HOSTING.md § 5
  # "The trigger"). The morning run is dispatched from outside by the Cloudflare Worker in ops/nightly-trigger/
  # (07:37 America/New_York, re-checks 09:37 and 11:37); the two cron lines above are the last resort.
  workflow_dispatch:
    inputs:
      full:
        description: "Also re-check every historical NFL season live (monthly audit)"
        type: boolean
        default: false
      backtests:
        description: "Recompute both backtests (normally copied from the hosted copy; backtest-v2 takes a while)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read     # the gate job reads today's runs of this workflow

# One writer (AGENTS.md rule 2; Wave H: the only writer of the hosted copy): a second run waits for the first;
# never two syncs at once.
concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Has a nightly already succeeded today (UTC)? Only the two scheduled times ask; a manual run always goes.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - name: Today's successful runs of this workflow
        id: today
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"; echo "a manual run: never skipped"; exit 0
          fi
          # PO (Wave I-S): "today" is New York's morning (since 07:30 there), not the UTC day - an evening refresh after
          # 20:00 New York is the next UTC day and used to make the next morning's scheduled run skip itself.
          since="$(date -u -d "TZ=\"America/New_York\" $(TZ=America/New_York date +%F) 07:30" +%Y-%m-%dT%H:%M:%SZ)"
          n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?status=success&created=>=${since}&per_page=10" \
                --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length" 2>/dev/null || echo 0)"
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=already published today::$n successful nightly run(s) today; this scheduled run does nothing"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"; echo "no successful nightly today: running"
          fi

  nightly:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        # 18, the same major as Neon (18.6 on 2026-10-02): restore-state dumps FROM Neon with this runner's pg_dump,
        # and pg_dump refuses a server newer than itself ("server version mismatch" ended run #4). Keep the service,
        # the client below and Neon on one major; when Neon moves up, move both here.
        image: postgres:18
        env:
          # superuser of a container that lives for this job only, reachable only from this runner
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # --shm-size: Docker's 64 MB /dev/shm is too small for parallel hash joins on the play tables
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python environment (uv.lock)
        run: uv sync --locked

      - name: PostgreSQL 18 client (pg_dump must be at least Neon's major, and match the service's)
        run: |
          # the runner ships PostgreSQL 16 tools; pg_dump refuses any server newer than itself (Neon is 18)
          if [ ! -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          fi
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-18 > /dev/null
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Season
        id: season
        run: |
          /usr/lib/postgresql/18/bin/pg_dump --version
          echo "season=$(uv run python -c 'from league_lab.ingest.nflverse import current_nfl_season; print(current_nfl_season())')" >> "$GITHUB_OUTPUT"

      # The archive (data/raw, ~280 MB: every nflverse file and Sleeper payload ever fetched) is what
      # the runner keeps between runs (the backtests come back from the hosted copy: nightly.sh
      # restore-state). Newest entry for this season first, then any season's (a new season starts
      # from last season's archive). Empty on the first run: nightly.sh then downloads the history.
      - name: Restore the raw archive
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: league-lab-raw-v1-${{ steps.season.outputs.season }}-${{ github.run_id }}
          restore-keys: |
            league-lab-raw-v1-${{ steps.season.outputs.season }}-
            league-lab-raw-v1-

      - name: Roles, database and .env for the service
        env:
          PGPASSWORD: postgres
          SLEEPER_LEAGUE_ID: ${{ secrets.LEAGUE_LAB_SLEEPER_LEAGUE_ID }}
          HOSTED_ADMIN_URL: ${{ secrets.LEAGUE_LAB_HOSTED_ADMIN_URL }}
          HOSTED_APP_PASSWORD: ${{ secrets.LEAGUE_LAB_HOSTED_APP_PASSWORD }}
        run: |
          league_ids="$(printf '%s' "$SLEEPER_LEAGUE_ID" | tr -d '[:space:]')"
          if ! [[ "$league_ids" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "::error title=secret LEAGUE_LAB_SLEEPER_LEAGUE_ID::missing or not a comma-separated list of league ids (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -n "$HOSTED_ADMIN_URL" ] && [ -z "$HOSTED_APP_PASSWORD" ]; then
            echo "::error title=secret LEAGUE_LAB_HOSTED_APP_PASSWORD::LEAGUE_LAB_HOSTED_ADMIN_URL is set but LEAGUE_LAB_HOSTED_APP_PASSWORD is not"
            exit 1
          fi
          [ -n "$HOSTED_ADMIN_URL" ] || echo "::warning title=no hosted sync::LEAGUE_LAB_HOSTED_ADMIN_URL is not set: this run builds everything and publishes nothing (and nothing else publishes: the hosted copy stays as it is)"
          PIPELINE_PW="$(openssl rand -hex 16)"
          APP_PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PIPELINE_PW"
          echo "::add-mask::$APP_PW"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            -v db_name=league_lab -v pipeline_pw="'$PIPELINE_PW'" -v app_pw="'$APP_PW'" \
            -f scripts/init_db.sql
          # The two hosted secrets are not written here: they reach nightly.sh as environment
          # variables (next step), byte for byte. python-dotenv expands ${...} even inside quotes,
          # so a .env line cannot carry every possible password.
          umask 077
          cat > .env <<EOF
          LEAGUE_LAB_DB_HOST=localhost
          LEAGUE_LAB_DB_PORT=5432
          LEAGUE_LAB_DB_NAME=league_lab
          LEAGUE_LAB_DB_USER=league_lab_pipeline
          LEAGUE_LAB_DB_PASSWORD=$PIPELINE_PW
          LEAGUE_LAB_APP_DB_USER=league_lab_app
          LEAGUE_LAB_APP_DB_PASSWORD=$APP_PW
          LEAGUE_LAB_SLEEPER_LEAGUE_ID=$league_ids
          LEAGUE_LAB_SEASONS_START=2016
          DBT_PROFILES_DIR=config/dbt
          EOF
          uv run league-lab db check

      # NIGHTLY_SLEEPER_OFFLINE is never set here: fetch-sleeper and fetch-projections (Sleeper's projections for the
      # next week to kick off, saved before the freeze) run live; GITHUB_ACTIONS=true makes sync-hosted run (one writer).
      - name: Nightly pipeline (scripts/nightly.sh)
        env:
          LEAGUE_LAB_HOSTED_ADMIN_URL: ${{ secrets.LEAGUE_LAB_HOSTED_ADMIN_URL }}
          LEAGUE_LAB_HOSTED_APP_PASSWORD: ${{ secrets.LEAGUE_LAB_HOSTED_APP_PASSWORD }}
          NIGHTLY_BACKTESTS: ${{ inputs.backtests && '1' || '' }}
          # Wave I-G (M4): the bonuses of a projected line priced at their odds (docs/METRICS.md § "The record's pricing
          # column"). `project` writes the mode into ops.projections.pricing and every request follows that record, so
          # Render needs no setting; rollback = delete this line and run the nightly again
          LEAGUE_LAB_EV_PRICING: "1"
          # Wave I-H (V-2): the MyFantasyLeague leagues whose lineups the decision record keeps (comma-separated league
          # keys; the on-demand lineup is frozen at the week's first kickoff and graded on MFL's own weekly scores).
          # Dad's league. Rollback = delete the line: the league then says it has no lineup record yet.
          LEAGUE_LAB_RECORD_MFL: "mfl:70587"
          # Wave I-R (IR-3): a publish whose connection to the hosted database is lost mid-restore is run again whole
          # (one transaction: nothing of the failed attempt is kept), up to twice, 30 s then 60 s apart. An SQL error
          # is never retried. Rollback = delete the line (0 = fail on the first lost connection, as before).
          LEAGUE_LAB_HOSTED_RETRIES: "2"
          # Wave I-U (IU-4): publish with no gap when two copies fit the plan (Neon Free: 1 GB a project; the cap is the
          # most the hosted database may hold at once). `auto` builds the new copy beside the live one and switches in
          # one transaction; a swap that stops before its commit (the space refused, a lost connection, a failed check)
          # keeps nothing and the same run publishes by the drop path, as before. Rollback = delete these two lines.
          LEAGUE_LAB_HOSTED_PUBLISH: auto
          LEAGUE_LAB_HOSTED_CAP_MB: "800"
        run: ./scripts/nightly.sh ${{ inputs.full && '--full' || '' }}

      # Save the archive only when its content changed (the key is a fingerprint of every data
      # file; a sidecar-only change, a new ETag or the time of the last check, does not count: the
      # content time a replay needs changes only with the bytes). In season that is most nights
      # (new Sleeper weeks, the current season's nflverse files); in the off-season it is rare.
      # Saved even when a later step failed: every archive file is written atomically, so a
      # partial night's archive is still a valid one.
      - name: Archive fingerprint
        id: fingerprint
        if: ${{ !cancelled() }}
        env:
          SEASON: ${{ steps.season.outputs.season }}
        run: |
          if [ -d data/raw ] && [ -n "$(find data/raw -type f -print -quit)" ]; then
            fp="$(cd data/raw && find . -type f ! -name '*.tmp' ! -name '*.meta.json' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
            echo "key=league-lab-raw-v1-${SEASON}-${fp}" >> "$GITHUB_OUTPUT"
            echo "archive: $(du -sh data/raw | cut -f1), $(find data/raw -type f | wc -l) files, fingerprint $fp"
          else
            echo "no archive to save"
          fi

      - name: Save the raw archive
        if: ${{ !cancelled() && steps.fingerprint.outputs.key != '' && steps.fingerprint.outputs.key != steps.restore.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: ${{ steps.fingerprint.outputs.key }}

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-logs
          path: logs/
          retention-days: 14
          if-no-files-found: warn

      # run_results.json of the last dbt invocation; logs/run_results.<step>.json keeps each one
      # (dbt-build is the full build, projection-marts the rebuild after `project`)
      - name: Upload dbt run results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dbt-run-results
          path: |
            dbt/target/run_results.json
            logs/run_results.*.json
          retention-days: 14
          if-no-files-found: warn

      # Wave I-H (IH-1): the failure summary — the failing stage, whether this night published the hosted copy, the next
      # move and the last 40 log lines (passwords blanked) in the run summary + one ::error annotation; always exits 0.
      # GitHub's own failure email goes to the actor (a dispatched run: the token's owner) — HOSTING § 5.
      - name: Notify (the failing stage and the last 40 log lines)
        if: ${{ failure() }}
        run: ./scripts/nightly_failure_summary.sh logs
