# dbt profile for League Lab. Values come from the environment (.env via `league-lab dbt ...`).
# Running plain `dbt` works too if you export the LEAGUE_LAB_DB_* variables first (see Makefile).
league_lab:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('LEAGUE_LAB_DB_HOST', 'localhost') }}"
      port: "{{ env_var('LEAGUE_LAB_DB_PORT', '5432') | int }}"
      user: "{{ env_var('LEAGUE_LAB_DB_USER', 'league_lab_pipeline') }}"
      password: "{{ env_var('LEAGUE_LAB_DB_PASSWORD') }}"
      dbname: "{{ env_var('LEAGUE_LAB_DB_NAME', 'league_lab') }}"
      schema: analytics
      threads: 4
      keepalives_idle: 60
      connect_timeout: 10
