# Render Blueprint (plan H0, Wave H): the League Lab beta server - the API and the phone web app, one service.
# How to use it, step by step, what it costs and what to do when it breaks: docs/DEPLOY.md.
#
# Render builds api/Dockerfile from this repository (the repository root is the build context) and deploys each
# commit on main after GitHub's checks pass (.github/workflows/image.yml builds and starts the same image first).
# The image the workflow pushes to ghcr.io is the alternative (DEPLOY.md § "Deploying the built image instead").
services:
  - type: web
    name: league-lab
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    branch: main
    # Standard: 2 GB, 1 CPU, always on, $25 a month (Andrew, 2026-10-06: "we would be upping that memory to 2g" — the
    # site is public since that morning). Was Starter: 512 MB, 0.5 CPU, $7 (the free plan sleeps after 15 idle
    # minutes). Measured on Starter (DEPLOY.md): ~150 MB after start, ~226 MB after the nightly, ~290 MB after every
    # screen of three leagues with Sleeper's full player directory in memory. One uvicorn process either way: the
    # limiter and the caches are per process (SECURITY_PUBLIC § 2).
    plan: standard
    # Put the server next to the database: Neon's us-east-2 (Ohio) = Render's ohio. Neon in us-east-1 → virginia,
    # us-west-2 → oregon, eu-central-1 → frankfurt (DEPLOY.md step 1 says where Neon shows it).
    region: ohio
    # one process: one Sleeper call budget and one cache (docs/SLEEPER_TERMS.md)
    numInstances: 1
    healthCheckPath: /api/health
    # The product's address (2026-10-04): Render adds www. with a redirect to the root and issues the certificate once
    # Cloudflare answers for it (two DNS-only CNAMEs, @ and www -> league-lab.onrender.com; SSL/TLS "Full";
    # docs/HOSTING.md § "The domain"). league-lab.onrender.com keeps answering.
    domains:
      - isuckatfantasy.io
    autoDeployTrigger: checksPass
    # a push that changes none of these (docs, dbt, the Streamlit pages) does not rebuild the server
    buildFilter:
      paths:
        - api/**
        - app/lib/**
        - app/pages/**
        - src/league_lab/**
        - web/**
        - .dockerignore
        - render.yaml
    # No disk: the only file the server writes is Sleeper's player directory (~15 MB), kept a day under
    # LEAGUE_LAB_CACHE_DIR. Render's own disk is wiped on a deploy or a restart, which costs one call to Sleeper -
    # a paid disk ($0.25/GB a month, and it turns off zero-downtime deploys) would save one call a deploy.
    envVars:
      - key: LEAGUE_LAB_APP_DB_URL
        sync: false     # Render asks for it: Neon's read-only URL (role league_lab_app, pooled, sslmode=require)
      - key: LEAGUE_LAB_APP_PASSWORD
        sync: false     # Render asks for it: the beta password (the one the Streamlit app uses)
      # Wave I-M (Andrew, 2026-10-05: "lets lose the password"): the site is public — no login screen, research without
      # a league, per-visitor rate limits (docs/SECURITY_PUBLIC.md). `password` here brings the beta password above
      # back for every route, with no code change.
      - key: LEAGUE_LAB_GATE
        value: open
      - key: LEAGUE_LAB_API_SECRET
        generateValue: true   # signs the sign-in cookie; Render makes one up (a new password then keeps people signed in)
      - key: LEAGUE_LAB_CACHE_DIR
        value: /srv/cache
      - key: LEAGUE_LAB_SLEEPER_PER_MIN
        value: "300"
      - key: LEAGUE_LAB_BOARD_SOURCE
        value: auto
      - key: PYTHONUNBUFFERED
        value: "1"
      # ---- Wave I-K (2026-10-05): other platforms and accounts. The two Yahoo secrets and the Resend key are pasted
      # once in Render (Environment → Add Environment Variable, or when the Blueprint sync asks); each feature stays
      # "coming soon" / off until its value exists (docs/HOSTING.md § "Yahoo", § "Accounts").
      - key: LEAGUE_LAB_YAHOO_CLIENT_ID
        sync: false     # Render asks for it: the Yahoo app's Client ID (developer.yahoo.com/apps)
      - key: LEAGUE_LAB_YAHOO_CLIENT_SECRET
        sync: false     # Render asks for it: the Yahoo app's Client Secret
      - key: LEAGUE_LAB_YAHOO_REDIRECT_URI
        value: https://isuckatfantasy.io/api/yahoo/callback
      # Yahoo approves every app's Fantasy access itself (sports.yahoo.com/developer/access); until it has, the sign-in
      # works and every data call is refused. "pending": the setup screen says "coming soon" and invites nobody to
      # connect. Remove this row (or set `open`) once /api/yahoo/status?probe=1 answers ok (docs/HOSTING.md § Yahoo 3).
      - key: LEAGUE_LAB_YAHOO_ACCESS
        value: pending
      - key: LEAGUE_LAB_RESEND_API_KEY
        sync: false     # Render asks for it: Resend's re_… key with sending access to isuckatfantasy.io — turns accounts on
